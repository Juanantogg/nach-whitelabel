version: 2

# Dependabot abre PRs de actualización de seguridad y de versión. Cubre dos
# ecosistemas: las dependencias npm del monorepo y las propias GitHub Actions
# (que pinneamos por SHA en los workflows — Dependabot las mantiene al día sin
# perder el pin). Ver docs/decisiones.md ADR 16.

updates:
  # --- Dependencias npm (pnpm) ---
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Agrupa parches y minors en un solo PR para no fragmentar la revisión;
    # los majors van sueltos (suelen traer breaking changes que revisar aparte).
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  # --- GitHub Actions ---
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
