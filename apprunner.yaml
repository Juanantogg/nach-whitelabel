# apprunner.yaml — despliegue del backend @nach/backend en AWS App Runner.
#
# Vive en la RAÍZ del repo (no en backend/): el install de pnpm necesita el
# pnpm-workspace.yaml y el pnpm-lock.yaml de la raíz, así que el SourceDirectory
# del servicio App Runner debe ser "/" (raíz) y el filtrado al backend lo hace
# `pnpm --filter`, no App Runner. Detalle y fuentes: progress/deploy/research-apprunner.md.
version: 1.0

# Único runtime Node vivo en App Runner (no existe nodejs20; 18/16 están EOS).
# nodejs22 satisface engines.node ">=20" del repo. Usa la "revised build".
runtime: nodejs22

build:
  commands:
    pre-build:
      # pnpm no viene en la imagen gestionada (solo npm/yarn). Se activa por
      # corepack, fijando la MISMA versión que packageManager en package.json.
      - corepack enable
      - corepack prepare pnpm@11.10.0 --activate
      # Instala SOLO el backend + sus deps del workspace, desde el lockfile.
      # --frozen-lockfile instala EXACTAMENTE lo del lockfile sin re-resolver, así
      # que NO dispara la cuarentena minimumReleaseAge (ADR 16). Incluye las
      # devDeps del backend (typescript) porque el build las necesita.
      - pnpm install --frozen-lockfile --filter @nach/backend...
    build:
      # Compila TS -> backend/dist (tsc -p tsconfig.build.json).
      - pnpm --filter @nach/backend build
    post-build:
      # Poda devDeps: deja solo runtime en la imagen final (imagen más pequeña,
      # menos superficie). Reinstala solo prod desde el lockfile (tampoco dispara
      # la cuarentena).
      - pnpm install --frozen-lockfile --filter @nach/backend --prod

run:
  # Fija major.minor.patch para builds reproducibles (evita que un patch nuevo
  # entre en un redeploy). Debe existir en la tabla de releases de nodejs22.
  runtime-version: 22.14.0
  # Arranca el server compilado con node directo (NO `pnpm start`, que asume
  # cwd=backend/ y un .env local). /app = raíz del repo copiada, el dist queda
  # en backend/dist/. server.ts lee el puerto de env.PORT.
  command: node backend/dist/server.js
  network:
    # El backend arranca en env.PORT (default 3001). App Runner enruta el tráfico
    # público (443) a este puerto interno.
    port: 3001
  env:
    - name: NODE_ENV
      value: production
    # CORS_ORIGINS NO es secreto (allowlist de operador, no credencial). Debe
    # permitir el front dev en CloudFront. Coma-separada si hay varios orígenes.
    - name: CORS_ORIGINS
      value: https://dev.garcia3apps.com
  secrets:
    # Inyectados desde SSM Parameter Store (SecureString) en runtime (ADR 11).
    # value-from = nombre del parámetro (misma región) o ARN completo. Se leen
    # SOLO en el deploy: rotar un parámetro exige un redeploy.
    - name: MONGODB_URI
      value-from: /nach/dev/MONGODB_URI
    - name: CRYPTO_PRIVATE_KEY
      value-from: /nach/dev/CRYPTO_PRIVATE_KEY
